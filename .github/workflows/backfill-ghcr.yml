name: backfill-ghcr

# One-shot / on-demand copy of already-published Docker Hub images to GHCR.
# Does NOT rebuild and does NOT create a release. It copies the existing
# multi-arch manifest (amd64 + arm64) straight from Docker Hub to GHCR.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Space-separated tags to copy'
        required: true
        default: '1.0 1.0.0 latest'

jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy tags Docker Hub -> GHCR
        run: |
          for t in ${{ github.event.inputs.tags }}; do
            echo "Copying $t ..."
            docker buildx imagetools create \
              --tag ghcr.io/comicsnowdev/gve-now:$t \
              docker.io/comicsnowdev/gve-now:$t
          done
          echo "Done. Resulting GHCR manifest for first tag:"
          docker buildx imagetools inspect ghcr.io/comicsnowdev/gve-now:latest
