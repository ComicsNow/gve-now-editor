name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Check if Docker tag is already pushed (Smart Skip)
        id: docker-check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/comicsnowdev/gve-now/tags/${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "comicsnowdev/gve-now:${VERSION} already exists on Docker Hub — skipping build."
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
        if: steps.docker-check.outputs.pushed != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.docker-check.outputs.pushed != 'true'
      - uses: docker/login-action@v3
        if: steps.docker-check.outputs.pushed != 'true'
        with:
          username: comicsnowdev
          password: ${{ secrets.DOCKER }}
      - uses: docker/login-action@v3
        if: steps.docker-check.outputs.pushed != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        if: steps.docker-check.outputs.pushed != 'true'
        id: meta
        with:
          images: |
            comicsnowdev/gve-now
            ghcr.io/comicsnow/gve-now
          tags: |
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        if: steps.docker-check.outputs.pushed != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build:web
      - name: Check if version is already on npm
        id: npm-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "gve-now@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "gve-now@${VERSION} is already published — skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package to npm
        if: steps.npm-version.outputs.published != 'true'
        run: npx npm@latest publish --provenance --access public
